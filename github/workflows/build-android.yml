name: Build Seblak Prasmanan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: SeblakPrasmananSimulator

jobs:
  build-android:
    name: Export Android Debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare Export Directory
        run: mkdir -v -p build/android

      - name: Export APK
        run: |
          cd project
          godot --headless --verbose --export-debug "Android" ../build/android/${EXPORT_NAME}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeblakPrasmanan-APK
          path: build/android/${EXPORT_NAME}.apk
